<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Combinatorial grammar: recurring building blocks across recipes, single-swap pairs, and design-space coverage" font-family='Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif'>
