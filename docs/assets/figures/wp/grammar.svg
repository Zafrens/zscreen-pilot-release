<rect width="1000" height="440" fill="#FFFFFF"/><text x="24" y="32" class="t-title" >A compound is a recipe of positional building blocks</text><text x="24" y="52" class="t-sub" ><tspan x="24" dy="0">The same block recurs across hundreds of molecules and across libraries, so its cellular effect can be isolated. Structures are withheld in</tspan><tspan x="24" dy="17">this public edition; block identities are schematic.</tspan></text><text x="116" y="108" class="t-ax" text-anchor="middle">bb0</text><text x="190" y="108" class="t-ax" text-anchor="middle">bb1</text><text x="264" y="108" class="t-ax" text-anchor="middle">bb2</text><text x="24" y="143" class="t-ax" >ZEL028</text><rect x="84" y="118" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="116" y="143" class="t-num" text-anchor="middle" font-size="13">A3</text><line x1="148" y1="138" x2="158" y2="138" stroke="#A6AEBF" stroke-width="2"/><rect x="158" y="118" width="64" height="40" rx="7" ry="7" fill="#EB9117" stroke="#B86B07" stroke-width="1.2"/><text x="190" y="143" class="t-numw" text-anchor="middle" font-size="13">B7</text><line x1="222" y1="138" x2="232" y2="138" stroke="#A6AEBF" stroke-width="2"/><rect x="232" y="118" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="264" y="143" class="t-num" text-anchor="middle" font-size="13">C1</text><text x="24" y="199" class="t-ax" >ZEL028</text><rect x="84" y="174" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="116" y="199" class="t-num" text-anchor="middle" font-size="13">A9</text><line x1="148" y1="194" x2="158" y2="194" stroke="#A6AEBF" stroke-width="2"/><rect x="158" y="174" width="64" height="40" rx="7" ry="7" fill="#EB9117" stroke="#B86B07" stroke-width="1.2"/><text x="190" y="199" class="t-numw" text-anchor="middle" font-size="13">B7</text><line x1="222" y1="194" x2="232" y2="194" stroke="#A6AEBF" stroke-width="2"/><rect x="232" y="174" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="264" y="199" class="t-num" text-anchor="middle" font-size="13">C4</text><text x="24" y="255" class="t-ax" >ZEL031</text><rect x="84" y="230" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="116" y="255" class="t-num" text-anchor="middle" font-size="13">A2</text><line x1="148" y1="250" x2="158" y2="250" stroke="#A6AEBF" stroke-width="2"/><rect x="158" y="230" width="64" height="40" rx="7" ry="7" fill="#EB9117" stroke="#B86B07" stroke-width="1.2"/><text x="190" y="255" class="t-numw" text-anchor="middle" font-size="13">B7</text><line x1="222" y1="250" x2="232" y2="250" stroke="#A6AEBF" stroke-width="2"/><rect x="232" y="230" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="264" y="255" class="t-num" text-anchor="middle" font-size="13">C6</text><text x="24" y="311" class="t-ax" >ZEL031</text><rect x="84" y="286" width="64" height="40" rx="7" ry="7" fill="#E9EBF7" stroke="#4A56B0" stroke-width="1.2"/><text x="116" y="311" class="t-num" text-anchor="middle" font-size="13">A2</text><line x1="148" y1="306" x2="158" y2="306" stroke="#A6AEBF" stroke-width="2"/><rect x="158" y="286" width="64" height="40" rx="7" ry="7" fill="#EB9117" stroke="#B86B07" stroke-width="1.2"/><text x="190" y="311" class="t-numw" text-anchor="middle" font-size="13">B7</text><line x1="222" y1="306" x2="232" y2="306" stroke="#A6AEBF" stroke-width="2"/><rect x="232" y="286" width="64" height="40" rx="7" ry="7" fill="#188281" stroke="#188281" stroke-width="1.2"/><text x="264" y="311" class="t-numw" text-anchor="middle" font-size="13">C8</text><rect x="312" y="122" width="150" height="56" rx="8" ry="8" fill="#FDF3E3" /><text x="322" y="142" class="t-line" fill="#B86B07"><tspan x="322" dy="0">Block B7 recurs across</tspan><tspan x="322" dy="14">recipes and libraries</tspan><tspan x="322" dy="14">(median block: 461</tspan><tspan x="322" dy="14">molecules)</tspan></text><path d="M304 236 h8 v84 h-8" fill="none" stroke="#188281" stroke-width="1.5"/><rect x="320" y="256" width="150" height="56" rx="8" ry="8" fill="#E6F4F3" /><text x="330" y="276" class="t-line" fill="#188281"><tspan x="330" dy="0">Single-swap pair: only</tspan><tspan x="330" dy="14">bb2 differs (5,077,542</tspan><tspan x="330" dy="14">measured pairs)</tspan></text><rect x="560" y="104" width="200" height="92" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><text x="576" y="142" class="t-big" >461</text><text x="576" y="164" class="t-lbl2" ><tspan x="576" dy="0">median molecules per</tspan><tspan x="576" dy="14">building block</tspan></text><rect x="772" y="104" width="200" height="92" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><text x="788" y="142" class="t-big" >~1,100</text><text x="788" y="164" class="t-lbl2" ><tspan x="788" dy="0">other molecules sharing a</tspan><tspan x="788" dy="14">compound’s rarest block</tspan></text><rect x="560" y="208" width="200" height="92" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><text x="576" y="246" class="t-big" >5.08 M</text><text x="576" y="268" class="t-lbl2" ><tspan x="576" dy="0">measured</tspan><tspan x="576" dy="14">single-substitution</tspan><tspan x="576" dy="14">compound pairs</tspan></text><rect x="772" y="208" width="200" height="92" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><text x="788" y="246" class="t-big" >722,397</text><text x="788" y="268" class="t-lbl2" ><tspan x="788" dy="0">unique recipes · 2,079,661</tspan><tspan x="788" dy="14">nominal compound–context</tspan><tspan x="788" dy="14">states</tspan></text><text x="560" y="326" class="t-lbl" font-weight="600">Measured coverage of the nominal design grid</text><rect x="560" y="338" width="412" height="16" rx="8" ry="8" fill="#E9EBF7" /><rect x="560" y="338" width="38" height="16" rx="8" ry="8" fill="#262F7B" /><text x="560" y="374" class="t-lbl2" ><tspan x="560" dy="0">190,699 measured profiles ≈ 9.2% of 2,079,661 nominal</tspan><tspan x="560" dy="16">compound–context states across 104,385 Bemis–Murcko scaffolds. The</tspan><tspan x="560" dy="16">unmeasured 90.8% is the space the models are asked to predict.</tspan></text></svg>