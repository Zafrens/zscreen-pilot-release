<rect width="1000" height="430" fill="#FFFFFF"/><text x="24" y="32" class="t-title" >From reusable chemistry to prioritized programs</text><text x="24" y="52" class="t-sub" >Numbers describe the pilot dataset analyzed in this paper; the platform itself is designed to scale to millions of compounds and beyond.</text><rect x="24" y="76" width="222" height="282" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><rect x="24" y="76" width="222" height="4" fill="#262F7B" rx="2"/><g transform="translate(40,96) scale(0.9)"><polygon points="17.8,16.5 10.0,21.0 2.2,16.5 2.2,7.5 10.0,3.0 17.8,7.5" fill="#262F7B"/><polygon points="34.8,16.5 27.0,21.0 19.2,16.5 19.2,7.5 27.0,3.0 34.8,7.5" fill="#EB9117"/><polygon points="51.8,16.5 44.0,21.0 36.2,16.5 36.2,7.5 44.0,3.0 51.8,7.5" fill="#188281"/></g><text x="40" y="146" class="t-kick" >1 · CHEMISTRY</text><text x="40" y="166" class="t-card" >Combinatorial library</text><circle cx="44" cy="186" r="2.2" fill="#262F7B" /><text x="53" y="190" class="t-line" ><tspan x="53" dy="0">627 reusable building blocks</tspan></text><circle cx="44" cy="208" r="2.2" fill="#262F7B" /><text x="53" y="212" class="t-line" ><tspan x="53" dy="0">5 positional slots (bb0–bb4)</tspan></text><circle cx="44" cy="230" r="2.2" fill="#262F7B" /><text x="53" y="234" class="t-line" ><tspan x="53" dy="0">162,914 pilot compounds</tspan></text><circle cx="44" cy="252" r="2.2" fill="#262F7B" /><text x="53" y="256" class="t-line" ><tspan x="53" dy="0">722,397-recipe design space</tspan></text><path d="M249 211 L263 217 L249 223" fill="none" stroke="#A6AEBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="268" y="76" width="222" height="282" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><rect x="268" y="76" width="222" height="4" fill="#262F7B" rx="2"/><g transform="translate(284,96) scale(0.9)"><rect x="0" y="0" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="13" y="0" width="10" height="10" rx="2" ry="2" fill="#EB9117" stroke="#262F7B" stroke-width="1"/><rect x="26" y="0" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="39" y="0" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="0" y="13" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="13" y="13" width="10" height="10" rx="2" ry="2" fill="#EB9117" stroke="#262F7B" stroke-width="1"/><rect x="26" y="13" width="10" height="10" rx="2" ry="2" fill="#EB9117" stroke="#262F7B" stroke-width="1"/><rect x="39" y="13" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="0" y="26" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="13" y="26" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/><rect x="26" y="26" width="10" height="10" rx="2" ry="2" fill="#EB9117" stroke="#262F7B" stroke-width="1"/><rect x="39" y="26" width="10" height="10" rx="2" ry="2" fill="#E9EBF7" stroke="#262F7B" stroke-width="1"/></g><text x="284" y="146" class="t-kick" >2 · MEASUREMENT</text><text x="284" y="166" class="t-card" >Z-Screen nanowell profiling</text><circle cx="288" cy="186" r="2.2" fill="#262F7B" /><text x="297" y="190" class="t-line" ><tspan x="297" dy="0">2–10 cells per nanowell</tspan></text><circle cx="288" cy="208" r="2.2" fill="#262F7B" /><text x="297" y="212" class="t-line" ><tspan x="297" dy="0">Up to 50,000 wells / run, &lt;$2</tspan><tspan x="297" dy="14">per condition</tspan></text><circle cx="288" cy="244" r="2.2" fill="#262F7B" /><text x="297" y="248" class="t-line" ><tspan x="297" dy="0">6,000-gene surface → 32</tspan><tspan x="297" dy="14">programs</tspan></text><circle cx="288" cy="280" r="2.2" fill="#262F7B" /><text x="297" y="284" class="t-line" ><tspan x="297" dy="0">Imaging on 33,575 compounds;</tspan><tspan x="297" dy="14">ActiveSeq same-well co-assay</tspan><tspan x="297" dy="14">on 11,435 wells</tspan></text><path d="M493 211 L507 217 L493 223" fill="none" stroke="#A6AEBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="512" y="76" width="222" height="282" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><rect x="512" y="76" width="222" height="4" fill="#262F7B" rx="2"/><g transform="translate(528,96) scale(0.9)"><polyline points="2,30 14,20 26,24 38,8 50,12" fill="none" stroke="#262F7B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="38" cy="8" r="3.5" fill="#EB9117" /><circle cx="14" cy="20" r="3.5" fill="#262F7B" /><circle cx="50" cy="12" r="3.5" fill="#188281" /></g><text x="528" y="146" class="t-kick" >3 · LEARNING</text><text x="528" y="166" class="t-card" >Models &amp; benchmarks</text><circle cx="532" cy="186" r="2.2" fill="#262F7B" /><text x="541" y="190" class="t-line" ><tspan x="541" dy="0">Block knockout r = 0.89–0.94</tspan></text><circle cx="532" cy="208" r="2.2" fill="#262F7B" /><text x="541" y="212" class="t-line" ><tspan x="541" dy="0">Recipe, transformer &amp; GNN</tspan><tspan x="541" dy="14">comparisons</tspan></text><circle cx="532" cy="244" r="2.2" fill="#262F7B" /><text x="541" y="248" class="t-line" ><tspan x="541" dy="0">SciPlex3 transfer: response r</tspan><tspan x="541" dy="14">= 0.593</tspan></text><circle cx="532" cy="280" r="2.2" fill="#262F7B" /><text x="541" y="284" class="t-line" ><tspan x="541" dy="0">Active-learning replays:</tspan><tspan x="541" dy="14">33–52% fewer measurements</tspan></text><path d="M737 211 L751 217 L737 223" fill="none" stroke="#A6AEBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="756" y="76" width="222" height="282" rx="10" ry="10" fill="#F6F7FB" stroke="#E3E6EE"/><rect x="756" y="76" width="222" height="4" fill="#EB9117" rx="2"/><g transform="translate(772,96) scale(0.9)"><circle cx="20" cy="16" r="15" fill="none" stroke="#262F7B" stroke-width="2"/><circle cx="20" cy="16" r="9" fill="none" stroke="#EB9117" stroke-width="2"/><circle cx="20" cy="16" r="3.5" fill="#188281" /></g><text x="772" y="146" class="t-kick" >4 · PRIORITIZATION</text><text x="772" y="166" class="t-card" >Phenomimicry &amp; programs</text><circle cx="776" cy="186" r="2.2" fill="#EB9117" /><text x="785" y="190" class="t-line" ><tspan x="785" dy="0">Chemical twins (LINCS,</tspan><tspan x="785" dy="14">Tahoe-100M, CIGS): 110 matches</tspan><tspan x="785" dy="14">/ 51 series</tspan></text><circle cx="776" cy="236" r="2.2" fill="#EB9117" /><text x="785" y="240" class="t-line" ><tspan x="785" dy="0">Genetic twins (43 Perturb-seq</tspan><tspan x="785" dy="14">sets, ~18,800 genes): 2,626</tspan><tspan x="785" dy="14">matches / 178 clusters</tspan></text><circle cx="776" cy="286" r="2.2" fill="#EB9117" /><text x="785" y="290" class="t-line" ><tspan x="785" dy="0">20 prioritized programs for</tspan><tspan x="785" dy="14">wet-lab follow-up</tspan></text><rect x="24" y="378" width="952" height="34" rx="8" ry="8" fill="#E9EBF7" /><text x="40" y="400" class="t-lbl" fill="#262F7B" font-weight="600">Measure cellular responses to reusable chemical parts → learn transferable rules → test the strongest chemical programs.</text></svg>