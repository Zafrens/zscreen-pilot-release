<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Z-Screen discovery architecture: four stages from combinatorial chemistry to prioritized programs" font-family='Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif'>
