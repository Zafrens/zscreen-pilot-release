<rect width="1000" height="480" fill="#FFFFFF"/><text x="24" y="32" class="t-title" >Genetic-reference calibration and genome-wide discovery</text><text x="24" y="52" class="t-sub" ><tspan x="24" dy="0">A: compound-median rank of the direct target across genome-wide and essential-gene Perturb-seq references (25 matched Tier-1 intracellular</tspan><tspan x="24" dy="17">compounds). B: the strict discovery funnel.</tspan></text><text x="24" y="106" class="t-panel" >A</text><text x="44" y="106" class="t-lbl" font-weight="600">Scoring-method calibration (0.5 = chance)</text><line x1="310" y1="124" x2="310" y2="364" stroke="#E3E6EE" /><text x="310" y="380" class="t-ax" text-anchor="middle">0.40</text><line x1="356" y1="124" x2="356" y2="364" stroke="#E3E6EE" /><text x="356" y="380" class="t-ax" text-anchor="middle">0.45</text><line x1="402" y1="124" x2="402" y2="364" stroke="#E3E6EE" /><text x="402" y="380" class="t-ax" text-anchor="middle">0.50</text><line x1="448" y1="124" x2="448" y2="364" stroke="#E3E6EE" /><text x="448" y="380" class="t-ax" text-anchor="middle">0.55</text><line x1="494.00000000000006" y1="124" x2="494.00000000000006" y2="364" stroke="#E3E6EE" /><text x="494.00000000000006" y="380" class="t-ax" text-anchor="middle">0.60</text><line x1="540.0000000000001" y1="124" x2="540.0000000000001" y2="364" stroke="#E3E6EE" /><text x="540.0000000000001" y="380" class="t-ax" text-anchor="middle">0.65</text><line x1="402" y1="120" x2="402" y2="366" stroke="#A6AEBF" stroke-dasharray="4 3" stroke-width="1.5"/><text x="402" y="116" class="t-ax" text-anchor="middle">chance</text><text x="24" y="134" class="t-lbl" font-weight="700">Unfloored cosine</text><text x="24" y="148" class="t-note" ><tspan x="24" dy="0">clean z, self-masked, no MAD floor</tspan></text><rect x="310" y="127" width="78.50974823876356" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="396.50974823876356" y="141" class="t-num" >0.4853</text><text x="24" y="174" class="t-lbl" font-weight="700">Full cosine</text><text x="24" y="188" class="t-note" ><tspan x="24" dy="0">clean z across all genes</tspan></text><rect x="310" y="167" width="127.40589296452191" height="18" rx="4" ry="4" fill="#262F7B" /><text x="445.4058929645219" y="181" class="t-num" >0.5385</text><text x="24" y="214" class="t-lbl" font-weight="700">MAD floor + vehicle baseline</text><text x="24" y="228" class="t-note" ><tspan x="24" dy="0">positive MAD floor, vehicle or library baseline</tspan></text><rect x="310" y="207" width="129.51785404849272" height="18" rx="4" ry="4" fill="#262F7B" /><text x="447.5178540484927" y="221" class="t-num" >0.5408 *</text><text x="24" y="254" class="t-lbl" font-weight="700">Deconfounded IDF cosine</text><text x="24" y="268" class="t-note" ><tspan x="24" dy="0">top-PC stress deconfounding</tspan></text><rect x="310" y="247" width="145.43919765984117" height="18" rx="4" ry="4" fill="#262F7B" /><text x="463.43919765984117" y="261" class="t-num" >0.5581</text><text x="24" y="294" class="t-lbl" font-weight="700">Bimodal Z-mutual ensemble</text><text x="24" y="308" class="t-note" ><tspan x="24" dy="0">calibrated five-channel ensemble</tspan></text><rect x="310" y="287" width="136.74301175712264" height="18" rx="4" ry="4" fill="#262F7B" /><text x="454.74301175712264" y="301" class="t-num" >0.5486</text><text x="24" y="334" class="t-lbl" font-weight="700">Control-contrast ensemble</text><text x="24" y="348" class="t-note" ><tspan x="24" dy="0">unblended control contrast (selected method)</tspan></text><rect x="310" y="327" width="165.706515209437" height="18" rx="4" ry="4" fill="#EB9117" /><text x="483.706515209437" y="341" class="t-num" >0.5801 *</text><text x="24" y="402" class="t-note" ><tspan x="24" dy="0">* Wilcoxon p &lt; 0.05 versus 0.5. MAD floor + vehicle baseline versus unfloored cosine: paired</tspan><tspan x="24" dy="14">median change +0.0867 (p = 0.0452). Source: evidence/crispr_calibration.csv.</tspan></text><text x="620" y="106" class="t-panel" >B</text><text x="640" y="106" class="t-lbl" font-weight="600">Strict discovery funnel (8 contexts)</text><rect x="620" y="124" width="150" height="38" rx="6" ry="6" fill="#262F7B" opacity="0.5"/><text x="786" y="140" class="t-num" font-size="15" font-weight="800">55,227,900</text><text x="786" y="155" class="t-note" ><tspan x="786" dy="0">(series, target) pairs tested</tspan></text><rect x="636.5" y="174" width="117" height="38" rx="6" ry="6" fill="#262F7B" opacity="0.6"/><text x="786" y="190" class="t-num" font-size="15" font-weight="800">2,626</text><text x="786" y="205" class="t-note" ><tspan x="786" dy="0">strict-gate discoveries; 0 synthetic</tspan><tspan x="786" dy="12">false discoveries at FDR &lt; 0.05</tspan></text><rect x="650" y="224" width="90" height="38" rx="6" ry="6" fill="#262F7B" opacity="0.7"/><text x="786" y="240" class="t-num" font-size="15" font-weight="800">2,229</text><text x="786" y="255" class="t-note" ><tspan x="786" dy="0">with lineage support (84.9%, a</tspan><tspan x="786" dy="12">selected-set fraction)</tspan></text><rect x="663.5" y="274" width="63" height="38" rx="6" ry="6" fill="#262F7B" opacity="0.8"/><text x="786" y="290" class="t-num" font-size="15" font-weight="800">178</text><text x="786" y="305" class="t-note" ><tspan x="786" dy="0">disjoint chemical program clusters</tspan></text><rect x="675.5" y="324" width="39" height="38" rx="6" ry="6" fill="#EB9117" opacity="0.9"/><text x="786" y="340" class="t-num" font-size="15" font-weight="800">10</text><text x="786" y="355" class="t-note" ><tspan x="786" dy="0">prioritized genetic-twin programs</tspan></text><text x="620" y="382" class="t-lbl2" font-weight="600">Chemical–genetic convergence among the 2,626:</text><rect x="620" y="390" width="112" height="42" rx="8" ry="8" fill="#F6F7FB" stroke="#E3E6EE"/><text x="630" y="411" class="t-num" font-size="16" fill="#262F7B" font-weight="800">168</text><text x="630" y="426" class="t-note" >Tier 1 · exact target</text><rect x="740" y="390" width="112" height="42" rx="8" ry="8" fill="#F6F7FB" stroke="#E3E6EE"/><text x="750" y="411" class="t-num" font-size="16" fill="#4A56B0" font-weight="800">138</text><text x="750" y="426" class="t-note" >Tier 2 · complex</text><rect x="860" y="390" width="112" height="42" rx="8" ry="8" fill="#F6F7FB" stroke="#E3E6EE"/><text x="870" y="411" class="t-num" font-size="16" fill="#A6AEBF" font-weight="800">455</text><text x="870" y="426" class="t-note" >Tier 3 · pathway</text></svg>