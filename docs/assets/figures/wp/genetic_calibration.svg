<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="CRISPR calibration on 25 matched Tier-1 compounds and the genome-wide discovery funnel" font-family='Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif'>
