<rect width="1000" height="560" fill="#FFFFFF"/><text x="24" y="32" class="t-title" >Model comparisons on saved test sets</text><text x="24" y="68" class="t-panel" >A</text><text x="44" y="68" class="t-lbl" font-weight="600">Unseen building blocks · HEK293 (7,544 held-out compounds)</text><text x="24" y="86" class="t-note" >5,721 training and 649 validation profiles for the matched models.</text><text x="330" y="102" class="t-ax" font-weight="600">Program r ↑</text><text x="552" y="102" class="t-ax" font-weight="600">Program R² ↑</text><text x="774" y="102" class="t-ax" font-weight="600">5% enrichment ↑</text><text x="24" y="118" class="t-lbl" font-weight="600">Chemprop v2.3.1 D-MPNN</text><text x="24" y="133" class="t-note" >end-to-end graph network, HEK293 only</text><rect x="330" y="106" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="106" width="112" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="450" y="119" class="t-num" >0.3367</text><rect x="552" y="106" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="106" width="89" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="649" y="119" class="t-num" >0.0888</text><rect x="774" y="106" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="106" width="127" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="909" y="119" class="t-num" >2.534×</text><text x="24" y="154" class="t-lbl" font-weight="600">Additive recipe model</text><text x="24" y="169" class="t-note" >building-block identities only, HEK293 only</text><rect x="330" y="142" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="142" width="121" height="18" rx="4" ry="4" fill="#262F7B" /><text x="459" y="155" class="t-num" >0.3628</text><rect x="552" y="142" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="142" width="109" height="18" rx="4" ry="4" fill="#262F7B" /><text x="669" y="155" class="t-num" >0.1094</text><rect x="774" y="142" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="142" width="131" height="18" rx="4" ry="4" fill="#262F7B" /><text x="913" y="155" class="t-num" >2.624×</text><text x="24" y="190" class="t-lbl" font-weight="600">Shared-context transformer (3-seed ensemble)</text><text x="24" y="205" class="t-note" >trained on all eight contexts</text><rect x="330" y="178" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="178" width="133" height="18" rx="4" ry="4" fill="#4A56B0" /><text x="471" y="191" class="t-num" >0.3978</text><rect x="552" y="178" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="178" width="6" height="18" rx="2" ry="2" fill="#EB9117" /><text x="564" y="191" class="t-num" fill="#B86B07">-0.987 (worse calibration)</text><rect x="774" y="178" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="178" width="143" height="18" rx="4" ry="4" fill="#4A56B0" /><text x="925" y="191" class="t-num" >2.861×</text><line x1="24" y1="228" x2="976" y2="228" stroke="#E3E6EE" /><text x="24" y="250" class="t-panel" >B</text><text x="44" y="250" class="t-lbl" font-weight="600">Public SciPlex3 transfer · DE50 genes (83 held-out drug–dose–cell conditions, 9 unseen drugs)</text><text x="24" y="268" class="t-note" >Released models are scored from their published checkpoints; the Chemprop arms share identical public supervision.</text><text x="330" y="290" class="t-ax" font-weight="600">Response r ↑</text><text x="552" y="290" class="t-ax" font-weight="600">Profile R² ↑</text><text x="774" y="290" class="t-ax" font-weight="600">Response RMSE ↓</text><text x="24" y="306" class="t-lbl" font-weight="600">Released scBalFlow</text><text x="24" y="321" class="t-note" >public checkpoint</text><rect x="330" y="294" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="294" width="72" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="410" y="307" class="t-num" >0.3378</text><rect x="552" y="294" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="294" width="103" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="663" y="307" class="t-num" >0.6171</text><rect x="774" y="294" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="294" width="136" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="918" y="307" class="t-num" >0.2363</text><text x="24" y="346" class="t-lbl" font-weight="600">Released chemCPA</text><text x="24" y="361" class="t-note" >public checkpoint</text><rect x="330" y="334" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="334" width="92" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="430" y="347" class="t-num" >0.4286</text><rect x="552" y="334" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="334" width="128" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="688" y="347" class="t-num" >0.7665</text><rect x="774" y="334" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="334" width="115" height="18" rx="4" ry="4" fill="#A6AEBF" /><text x="897" y="347" class="t-num" >0.1991</text><text x="24" y="386" class="t-lbl" font-weight="600">Conditional Chemprop, public data only</text><text x="24" y="401" class="t-note" >scratch, trained to validation optimum (58 epochs)</text><rect x="330" y="374" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="374" width="96" height="18" rx="4" ry="4" fill="#4A56B0" /><text x="434" y="387" class="t-num" >0.4490</text><rect x="552" y="374" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="374" width="133" height="18" rx="4" ry="4" fill="#4A56B0" /><text x="693" y="387" class="t-num" >0.7976</text><rect x="774" y="374" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="374" width="104" height="18" rx="4" ry="4" fill="#4A56B0" /><text x="886" y="387" class="t-num" >0.1811</text><text x="24" y="426" class="t-lbl" font-weight="600">Conditional Chemprop, Z-Screen pretrained</text><text x="24" y="441" class="t-note" >same public supervision, converges at 7 epochs</text><rect x="330" y="414" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="414" width="127" height="18" rx="4" ry="4" fill="#EB9117" /><text x="465" y="427" class="t-num" >0.5931</text><rect x="552" y="414" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="414" width="135" height="18" rx="4" ry="4" fill="#EB9117" /><text x="695" y="427" class="t-num" >0.8114</text><rect x="774" y="414" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="414" width="102" height="18" rx="4" ry="4" fill="#EB9117" /><text x="884" y="427" class="t-num" >0.1766</text><text x="24" y="466" class="t-lbl" font-weight="600">Conditional Chemprop, scratch at 7 epochs</text><text x="24" y="481" class="t-note" >training-duration control</text><rect x="330" y="454" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="330" y="454" width="132" height="18" rx="4" ry="4" fill="#188281" /><text x="470" y="467" class="t-num" >0.6175</text><rect x="552" y="454" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="552" y="454" width="132" height="18" rx="4" ry="4" fill="#188281" /><text x="692" y="467" class="t-num" >0.7944</text><rect x="774" y="454" width="150" height="18" rx="4" ry="4" fill="#F6F7FB" /><rect x="774" y="454" width="106" height="18" rx="4" ry="4" fill="#188281" /><text x="888" y="467" class="t-num" >0.1840</text><text x="24" y="530" class="t-lbl2" fill="#188281" font-weight="600">Reading B: Z-Screen pretraining keeps the best profile R² and lowest RMSE, but a scratch run stopped at the same 7 epochs has higher response r.</text><text x="24" y="548" class="t-note" >The response-correlation gain over the 58-epoch scratch run therefore reflects training duration as well as pretraining. Seed SD of the paired DE50 Δr difference: 0.062.</text></svg>